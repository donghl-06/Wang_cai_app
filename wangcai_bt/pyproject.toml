[build-system]
requires = [
 "scikit-build-core>=0.9",
 "pybind11>=2.12",
 "setuptools>=68",
 "wheel"
]
build-backend = "scikit_build_core.build"

[project]
name = "wangcai-bt"
version = "0.1.0"
description = "Python bindings for WangCai backtest engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "aitopia" }]
license = { text = "MIT" }
classifiers = [
 "Programming Language :: Python :: 3",
 "Programming Language :: C++",
 "Operating System :: OS Independent"
]

[tool.scikit-build]
# CMakeLists.txt 在上一级目录
cmake.source-dir = ".."

# --- 这是根据最新报错信息修正的最终版本 ---
[tool.scikit-build.wheel]
# 使用正确的关键字 'packages'，并明确指向您的包所在的目录
packages = ["src/wangcai_bt"]

# 告诉打包工具，将CMake编译的所有产物，安装到最终包内的 "wangcai_bt" 目录下
install-dir = "wangcai_bt"


[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.poetry.group.dev.dependencies]
scikit-build-core = "^0.11.5"
pybind11 = "^3.0.0"
setuptools = "^80.9.0"
wheel = "^0.45.1"